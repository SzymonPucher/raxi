[package]
name = "raxi"
version = "0.1.0"
description = "RAXI — Roguelike Arcade Taxi"
authors = ["Raxi Team"]
edition = "2021"

[lib]
name = "raxi_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
